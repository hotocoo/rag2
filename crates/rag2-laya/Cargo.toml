[package]
name = "rag2-laya"
description = "Decision models for RAG2: in-process Laya checkpoints on candle, Laya and System One (d1) HTTP adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Apple GPU (Metal) and Accelerate BLAS.
metal = ["candle-core/metal", "candle-core/accelerate", "candle-nn/metal", "candle-nn/accelerate"]
# NVIDIA GPU.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
rag2-core.workspace = true
rag2-config.workspace = true
rag2-engine.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
tokenizers.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
parking_lot.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
axum.workspace = true

[lints]
workspace = true
