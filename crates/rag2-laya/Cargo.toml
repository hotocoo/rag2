[package]
name = "rag2-laya"
description = "In-process Laya decision checkpoints for RAG2, on candle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Apple GPU (Metal) and Accelerate BLAS.
metal = ["rag2-modernbert/metal", "candle-core/metal", "candle-core/accelerate", "candle-nn/metal", "candle-nn/accelerate"]
# NVIDIA GPU.
cuda = ["rag2-modernbert/cuda", "candle-core/cuda", "candle-nn/cuda"]

[dependencies]
rag2-core.workspace = true
rag2-config.workspace = true
rag2-engine.workspace = true
rag2-decision.workspace = true
rag2-modernbert.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
tokenizers.workspace = true
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true
