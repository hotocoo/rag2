[package]
name = "rag2-cli"
description = "The rag2 command: run the service, manage configuration, generate keys, query and ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rag2"
path = "src/main.rs"

[features]
default = ["models", "plugins"]
# Sandboxed Wasm plugins (Wasmtime).
plugins = ["dep:rag2-plugins"]
# Local models on candle (Laya decision checkpoints, ModernBERT embedders) and HTTP embedders.
models = ["dep:rag2-laya", "dep:rag2-embed"]
metal = ["models", "rag2-laya/metal", "rag2-embed/metal"]
cuda = ["models", "rag2-laya/cuda", "rag2-embed/cuda"]

[dependencies]
rag2-laya = { workspace = true, optional = true }
rag2-embed = { workspace = true, optional = true }
rag2-plugins = { workspace = true, optional = true }
rag2-core.workspace = true
rag2-config.workspace = true
rag2-engine.workspace = true
rag2-server.workspace = true
rag2-client.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics-exporter-prometheus.workspace = true
getrandom.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
