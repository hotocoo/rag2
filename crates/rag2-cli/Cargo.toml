[package]
name = "rag2-cli"
description = "The rag2 command: run the service, manage configuration, generate keys, query and ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rag2"
path = "src/main.rs"

[features]
default = ["models", "plugins"]
# Sandboxed Wasm plugins (Wasmtime).
plugins = ["rag2/plugins"]
# Local models on candle (Laya, ModernBERT), HTTP embedders, d1 System One decision models.
models = ["rag2/models"]
metal = ["rag2/metal"]
cuda = ["rag2/cuda"]

[dependencies]
rag2.workspace = true
rag2-core.workspace = true
rag2-config.workspace = true
rag2-engine.workspace = true
rag2-server.workspace = true
rag2-client.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics-exporter-prometheus.workspace = true
getrandom.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
