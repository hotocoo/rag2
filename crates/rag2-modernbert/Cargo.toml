[package]
name = "rag2-modernbert"
description = "ModernBERT encoder on candle with fused CPU kernels, shared by RAG2's embedders and decision models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Apple GPU (Metal) and Accelerate BLAS.
metal = ["candle-core/metal", "candle-core/accelerate", "candle-nn/metal", "candle-nn/accelerate"]
# NVIDIA GPU.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
serde.workspace = true
rayon.workspace = true

[lints]
workspace = true
