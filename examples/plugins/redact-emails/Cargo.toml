[package]
name = "redact-emails"
version = "1.0.0"
edition = "2024"
publish = false

# Standalone: builds for wasm32-unknown-unknown, outside the server workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
