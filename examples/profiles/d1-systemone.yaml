# Liquid AI d1 as the decision model, served by llama.cpp (v0.8.0 / b11960 or newer):
#   llama-server -hf LiquidAI/d1-2B-GGUF:Q8_0 --alias d1-2B -b 16384 -ub 16384 -np 1 --port 8081
# d1 picks the retrieval route (`choice`), gates relevance and confirms contradictions (`noul`).
# RAG2 falls back to the configured route, or keeps the passage, when d1 is unavailable or unsure.
api_version: rag2/v1
metadata:
  name: d1
server:
  listen: 127.0.0.1:8080
decision_models:
  d1:
    kind: system_one
    endpoint: http://127.0.0.1:8081
    serve_id: d1-2B
    timeout_ms: 2000                # per decision stage, queueing included; then fail open
    concurrency: 1                  # in flight across all queries; RAG2 queues the rest FIFO
pipelines:
  default:
    retrievers:
      - { kind: dense, embedder: default }
      - { kind: lexical }
    routing:
      mode: decision
      model: d1
      instructions: Which retrieval strategy best answers this search query?
      routes:
        keyword: { description: "exact names, codes or quoted phrases", retrievers: [lexical] }
        semantic: { description: "questions about meaning or concepts", retrievers: [dense] }
        both: { description: "mixed or unclear queries", retrievers: [dense, lexical] }
      min_confidence: 0.6
      fallback: [dense, lexical]
    relevance_gate:
      model: d1
      instructions: Does the passage contain information that answers the query?
      min_confidence: 0.9
    contradiction:
      decision:
        model: d1
        instructions: Do the two passages make claims that contradict each other?
        min_confidence: 0.9
