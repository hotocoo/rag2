name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit --deny warnings
      - run: cargo deny check licenses bans sources
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # console/vendor/hesperides: the design system
          # hotocoo/hesperides-design-system is private: GITHUB_TOKEN cannot read another private
          # repo, so a read-only token for it goes in this secret.
          token: ${{ secrets.HESPERIDES_READ_TOKEN || github.token }}
      - run: rustup target add wasm32-unknown-unknown && cargo install trunk --locked
      - run: cd console && trunk build --release
